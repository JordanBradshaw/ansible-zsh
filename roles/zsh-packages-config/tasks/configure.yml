- name: Rsync a directory from control to remote, merging (no deletes)
  ansible.posix.synchronize:
    src: "config/"                        # path on control node (same as before)
    dest: "{{ zsh_user_config_dir | trim }}/"   # remote dir
    archive: false                        # don't force owner/perms/etc
    recursive: true
    delete: false                         # keep extra files on remote
    rsync_opts:
      - "--chmod=F644,D755"               # files 0644, dirs 0755
  delegate_to: localhost


- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  
# - name: Check packages
#   debug:
#     var: ansible_facts.packages

- name: Copy zsh tool configs
  include_tasks: copy-config.yml
  loop: '{{ zsh_packages }}'
  loop_control:
    label: '{{ item }}'
  when: not is_devcontainer
